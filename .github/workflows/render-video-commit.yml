# Render missing videos on main and propose the mp4s back via a PR.
#
# After a draft PR with a video source merges, this renders any source
# (.slides.txt / .cast / .tape) that has no matching videos/<base>.mp4 and
# pushes the result to the fixed branch automation/render-videos, then opens
# (or updates) a PR into main. The node's poller (watch-and-publish.sh)
# prefers an existing mp4 on main over rendering locally, so once that PR
# merges the Termux node never needs vhs/agg.
#
# main is never pushed directly: the default-branch ruleset (PR + 1 approval
# + merge queue) rejected the old direct push since 2026-06-12 (#42).
# If Actions may not create PRs in this repo (the repo setting is off by
# design: it would also let Actions approve PRs), the run leaves a warning
# and a compare link instead; a maintainer opens the PR from it.
#
# The branch is rebuilt from main on every run and force-pushed, so it always
# holds exactly the renders main is missing. Do not push edits to it by hand.
#
# Loop guard: the render PR only adds mp4s; the run its merge triggers finds
# no missing sources and exits without pushing.

name: Render and commit videos

on:
  push:
    branches: [main]
    paths:
      - "videos/**"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: render-video-commit
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find sources missing an mp4
        id: missing
        run: |
          MISSING=""
          for src in videos/*.slides.txt videos/*.cast videos/*.tape; do
            [ -e "$src" ] || continue
            base=$(basename "$src")
            for ext in .slides.txt .cast .tape; do base=${base%"$ext"}; done
            [ -f "videos/$base.mp4" ] || MISSING="$MISSING$src"$'\n'
          done
          echo "Missing renders:"; echo "$MISSING"
          {
            echo 'files<<EOF'
            printf '%s' "$MISSING"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Install ffmpeg
        if: steps.missing.outputs.files != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install vhs + ttyd (.tape sources)
        if: contains(steps.missing.outputs.files, '.tape')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R charmbracelet/vhs -p '*Linux_x86_64.tar.gz' -O /tmp/vhs.tgz
          tar -xzf /tmp/vhs.tgz -C /tmp
          sudo mv "$(find /tmp -type f -name vhs | head -1)" /usr/local/bin/vhs
          sudo curl -fsSL -o /usr/local/bin/ttyd \
            https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          sudo chmod +x /usr/local/bin/ttyd /usr/local/bin/vhs

      - name: Install agg (.cast sources)
        if: contains(steps.missing.outputs.files, '.cast')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R asciinema/agg -p '*x86_64-unknown-linux-gnu' -O /tmp/agg
          sudo install -m 755 /tmp/agg /usr/local/bin/agg

      - name: Render
        if: steps.missing.outputs.files != ''
        env:
          MISSING_FILES: ${{ steps.missing.outputs.files }}
        run: |
          printf '%s\n' "$MISSING_FILES" | while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! printf '%s\n' "$f" | grep -Eq '^videos/[A-Za-z0-9._-]+\.(slides\.txt|cast|tape)$'; then
              echo "::error::Rejected video source path (allowed: ^videos/[A-Za-z0-9._-]+\\.(slides\\.txt|cast|tape)\$)"
              printf 'rejected: %q\n' "$f"
              exit 1
            fi
            scripts/render-video.sh "$f"
          done

      - name: Push render branch and open PR
        if: steps.missing.outputs.files != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RENDER_BRANCH: automation/render-videos
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- 'videos/*.mp4')" ]; then
            echo "No new mp4 rendered; nothing to propose."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$RENDER_BRANCH"
          git add -- videos/*.mp4
          git commit -m "Render videos for publish (CI)"
          git push --force origin "HEAD:refs/heads/$RENDER_BRANCH"

          compare="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/main...$RENDER_BRANCH?expand=1"
          existing=$(gh pr list --base main --head "$RENDER_BRANCH" --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            echo "Updated the open render PR: $existing"
            echo "Updated render PR: $existing" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          body=$(printf 'CI-rendered mp4s for video sources on main that had none.\n\nRun: %s\n\nReview before merging: play each video to the end (safety.md: no tokens/paths in frame). Merging lets the node poller use these files instead of rendering locally.\n' "$RUN_URL")
          if pr_url=$(gh pr create --base main --head "$RENDER_BRANCH" \
              --title "Render videos for publish (CI)" --body "$body" 2>/tmp/pr-create.err); then
            echo "Opened render PR: $pr_url"
            echo "Opened render PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "gh pr create failed: $(head -c 300 /tmp/pr-create.err)"
            echo "::warning::Rendered mp4s are on $RENDER_BRANCH but no PR was opened (Actions may not create PRs here). Open it from: $compare"
            echo "Render branch pushed, PR not opened. Open it from: $compare" >> "$GITHUB_STEP_SUMMARY"
          fi
