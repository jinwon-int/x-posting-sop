# Render video previews for PRs that touch videos/**.
#
# Rendering needs no X credentials, so it runs on GitHub-hosted runners —
# this is how .tape (vhs) sources get rendered without installing vhs on
# the Termux node. The rendered mp4s are uploaded as a workflow artifact
# and a PR comment links to them, so the owner can review the video
# together with the draft BEFORE merging (merge = publish approval).

name: Render video preview

on:
  pull_request:
    paths:
      - "videos/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed video sources
        id: sources
        run: |
          FILES=$(git diff --name-only --diff-filter=AM \
            "${{ github.event.pull_request.base.sha }}" HEAD \
            -- 'videos/*.slides.txt' 'videos/*.cast' 'videos/*.tape' | sort -u)
          echo "Changed sources:"; echo "$FILES"
          {
            echo 'files<<EOF'
            echo "$FILES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Install ffmpeg
        if: steps.sources.outputs.files != ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Install vhs + ttyd (.tape sources)
        if: contains(steps.sources.outputs.files, '.tape')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R charmbracelet/vhs -p '*Linux_x86_64.tar.gz' -O /tmp/vhs.tgz
          tar -xzf /tmp/vhs.tgz -C /tmp
          sudo mv "$(find /tmp -type f -name vhs | head -1)" /usr/local/bin/vhs
          sudo curl -fsSL -o /usr/local/bin/ttyd \
            https://github.com/tsl0922/ttyd/releases/latest/download/ttyd.x86_64
          sudo chmod +x /usr/local/bin/ttyd /usr/local/bin/vhs

      - name: Install agg (.cast sources)
        if: contains(steps.sources.outputs.files, '.cast')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R asciinema/agg -p '*x86_64-unknown-linux-gnu' -O /tmp/agg
          sudo install -m 755 /tmp/agg /usr/local/bin/agg

      - name: Render
        if: steps.sources.outputs.files != ''
        run: |
          echo "${{ steps.sources.outputs.files }}" | while IFS= read -r f; do
            [ -n "$f" ] || continue
            scripts/render-video.sh "$f"
          done

      - name: Upload previews
        if: steps.sources.outputs.files != ''
        uses: actions/upload-artifact@v4
        with:
          name: video-previews
          path: videos/*.mp4
          if-no-files-found: error

      - name: Comment on PR
        if: steps.sources.outputs.files != ''
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- video-preview-comment -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const files = `${{ steps.sources.outputs.files }}`.split('\n').filter(Boolean);
            const body = [
              marker,
              '## 🎬 Video preview rendered',
              '',
              ...files.map(f => `- \`${f}\``),
              '',
              `X-spec mp4 산출물: [workflow artifacts](${runUrl}) → \`video-previews\``,
              '',
              '머지 전에 다운로드해서 끝까지 재생 확인 (safety.md: 프레임 내 토큰/경로 노출 체크).',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo, issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });
            }
